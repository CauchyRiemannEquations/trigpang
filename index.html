<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>삼각팡 - TRIGPANG</title>
<meta name="theme-color" content="#ffd84d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Bagel+Fat+One&family=Outfit:wght@400;600;700;800&family=STIX+Two+Text:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 수열팡 시리즈 공통 포레스트 팔레트 + 삼각팡 파인애플 골드 */
  --deep:#06291f; --forest:#0b3a2b; --forest-soft:#124a36;
  --gold:#ffd84d; --gold-deep:#f0a80a; --gold-soft:#ffe58a;
  --lime:#94f20d; --lime-deep:#72cf0a;
  --ivory:#fffbea; --coral:#ff6b6b; --cyan:#6ee3d6;
  --text:#f7ffe8; --muted:#91b69f;
  --line:rgba(255,216,77,.18);
  --panel:rgba(6,41,31,.74);
  --shadow:0 24px 60px rgba(0,18,12,.42);
  --t: min(calc((100vw - 100px)/6), 56px); --g: 6px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
html{background:var(--deep)}
html,body{height:100%}
body{
  background:
    radial-gradient(circle at 12% 18%, rgba(255,216,77,.10), transparent 22rem),
    radial-gradient(circle at 88% 82%, rgba(110,227,214,.09), transparent 25rem),
    var(--deep);
  color:var(--text); font-family:"Jua","Outfit",sans-serif; font-size:15px;
  display:flex; justify-content:center; align-items:flex-start; overflow-x:hidden; padding:12px 8px;
}
.game-layout{width:100%; max-width:430px}
.game-container{
  position:relative; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  min-height:min(760px, calc(100dvh - 24px));
  padding:14px 14px 20px;
  background:var(--forest);
  border:1px solid rgba(255,216,77,.12);
  border-radius:28px;
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.04);
}
.game-container::before{
  content:''; position:absolute; right:-88px; bottom:8%;
  width:150px; height:150px; border-radius:50%;
  background:rgba(255,216,77,.06); pointer-events:none;
}

/* ---------- 웰컴 오버레이 (메인 화면) ---------- */
.welcome-overlay{
  position:absolute; inset:0; z-index:10;
  display:flex; padding:22px 18px; overflow-y:auto;
  background:
    radial-gradient(circle at 86% 16%, rgba(255,216,77,.12) 0 54px, transparent 55px),
    linear-gradient(155deg, #0b3a2b 0%, #06291f 100%);
  border-radius:28px;
  opacity:1; visibility:visible;
  transition:opacity .35s ease, visibility .35s ease, transform .35s ease;
}
.welcome-overlay::before{
  content:''; position:absolute; left:-92px; bottom:7%;
  width:150px; height:150px; border-radius:50%;
  background:rgba(110,227,214,.11); pointer-events:none;
}
.welcome-overlay.hide{opacity:0; visibility:hidden; transform:scale(.95); pointer-events:none}

/* 떠다니는 파인애플 파티클 */
.pine-particle{
  position:absolute; bottom:0; font-size:26px; opacity:0; color:var(--gold-soft);
  animation:floatParticle linear infinite; pointer-events:none; filter:blur(.5px);
}
@keyframes floatParticle{
  0%{transform:translateY(60px) rotate(0deg); opacity:0}
  10%{opacity:.13} 90%{opacity:.13}
  100%{transform:translateY(calc(-100dvh - 80px)) rotate(360deg); opacity:0}
}
.particle-1{left:8%;  animation-duration:9s;  animation-delay:0s;   font-size:32px}
.particle-2{left:22%; animation-duration:12s; animation-delay:2s;   font-size:20px}
.particle-3{left:42%; animation-duration:8s;  animation-delay:4.5s; font-size:26px}
.particle-4{left:63%; animation-duration:11s; animation-delay:1.2s; font-size:18px}
.particle-5{left:80%; animation-duration:10s; animation-delay:3s;   font-size:30px}
.particle-6{left:91%; animation-duration:13s; animation-delay:5.5s; font-size:22px}

/* 반짝이 */
.sparkle{
  position:absolute; width:6px; height:6px; border-radius:50%;
  background:var(--gold); box-shadow:0 0 14px rgba(255,216,77,.7);
  animation:sparklePop 2.4s ease-in-out infinite; pointer-events:none;
}
@keyframes sparklePop{
  0%,100%{transform:scale(0); opacity:0}
  40%{transform:scale(1); opacity:.7}
  70%{transform:scale(.6); opacity:.4}
}
.sparkle-1{top:18%; left:15%; animation-delay:0s}
.sparkle-2{top:30%; left:78%; animation-delay:.8s}
.sparkle-3{top:70%; left:25%; animation-delay:1.4s}
.sparkle-4{top:80%; left:65%; animation-delay:.3s}
.sparkle-5{top:55%; left:88%; animation-delay:1.9s}

.welcome-card{
  width:100%; max-width:340px; position:relative; z-index:1; margin:auto;
  display:flex; flex-direction:column; gap:11px; text-align:center; align-items:center;
}
.welcome-icon-wrap{
  width:76px; height:76px; display:grid; place-items:center; border-radius:50%;
  background:rgba(255,216,77,.10); box-shadow:0 0 34px rgba(255,216,77,.20);
}
.welcome-icon{
  font-size:46px; line-height:1;
  animation:pineBounce 2.2s infinite alternate ease-in-out;
  filter:drop-shadow(0 8px 16px rgba(240,168,10,.45));
}
@keyframes pineBounce{
  from{transform:translateY(0) rotate(-4deg) scale(1)}
  to{transform:translateY(-12px) rotate(4deg) scale(1.05)}
}
.welcome-logo{width:100%; max-width:260px; margin:0 auto}
.welcome-logo svg{display:block; width:100%; height:auto}
.welcome-tagline{color:var(--muted); font-size:14px; font-family:"Jua",sans-serif}

.diff-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%}
.diff-btn{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:12px 8px; border-radius:13px;
  background:rgba(6,41,31,.72); border:1px solid var(--line); color:var(--text);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  transition:transform .14s ease, border-color .14s ease, background .14s ease;
}
.diff-btn:hover{transform:translateY(-2px); background:rgba(18,74,54,.8)}
.diff-btn:active{transform:translateY(1px)}
.diff-btn b{font-size:17px; line-height:1}
.diff-btn span{font-size:11px; color:var(--muted); font-family:"Jua",sans-serif}
.diff-btn small{font-size:10px; color:var(--gold-soft); font-family:"Outfit",sans-serif; font-weight:700}
.diff-btn[data-diff="easy"] b{color:var(--lime)}
.diff-btn[data-diff="normal"] b{color:var(--gold)}
.diff-btn[data-diff="hard"] b{color:var(--coral)}
.diff-btn[data-diff="master"] b{color:#c084fc}
.diff-btn[data-diff="easy"]:hover{border-color:rgba(148,242,13,.5)}
.diff-btn[data-diff="normal"]:hover{border-color:rgba(255,216,77,.55)}
.diff-btn[data-diff="hard"]:hover{border-color:rgba(255,107,107,.55)}
.diff-btn[data-diff="master"]:hover{border-color:rgba(192,132,252,.55)}
.diff-wide{grid-column:1 / -1; flex-direction:row; justify-content:center; align-items:baseline; gap:8px; padding:10px 8px}
.diff-btn[data-diff="hell"] b{color:#f87171; text-shadow:0 0 12px rgba(248,113,113,.5)}
.diff-btn[data-diff="hell"]:hover{border-color:rgba(248,113,113,.6)}
.swipe-launch{
  display:flex; flex-direction:row; align-items:baseline; justify-content:center; gap:8px;
  width:100%; padding:12px 8px; border-radius:13px;
  background:rgba(110,227,214,.08); border:1px solid rgba(110,227,214,.3); color:var(--text);
  transition:transform .14s ease, border-color .14s ease;
}
.swipe-launch:hover{transform:translateY(-2px); border-color:rgba(110,227,214,.6)}
.swipe-launch:active{transform:translateY(1px)}
.swipe-launch b{font-size:16px; color:var(--cyan)}
.swipe-launch span{font-size:11px; color:var(--muted); font-family:"Jua",sans-serif}
.swipe-launch small{font-size:10px; color:var(--gold-soft); font-family:"Outfit",sans-serif; font-weight:700}

.how-to-play{
  width:100%; padding:10px 12px; text-align:left; border-radius:14px;
  background:rgba(6,41,31,.72); border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  display:flex; flex-direction:column; gap:5px;
}
.htp-title{color:var(--gold-soft); font-size:11px; letter-spacing:.08em}
.htp-row{color:#bed4c5; font-size:12px; line-height:1.5; font-family:"Jua",sans-serif; display:flex; gap:8px; align-items:flex-start}
.htp-row .dot{flex:none; width:7px; height:7px; border-radius:50%; margin-top:6px; background:var(--gold)}
.htp-row:nth-child(3) .dot{background:var(--lime)}
.htp-row:nth-child(4) .dot{background:var(--cyan)}
.htp-highlight{color:var(--gold)}
.htp-ex{font-family:"STIX Two Text",serif; font-weight:600; color:var(--gold-soft)}

button{font-family:"Jua",sans-serif; cursor:pointer; border:0}
button:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.btn-start{
  width:100%; padding:14px; border-radius:13px; font-size:18px; letter-spacing:.02em;
  background:linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
  color:#3b2302;
  box-shadow:0 9px 20px rgba(240,168,10,.24), inset 0 -3px 0 rgba(90,55,0,.18);
  transition:transform .14s ease, filter .14s ease;
}
.btn-start:hover{transform:translateY(-2px); filter:brightness(1.04)}
.btn-start:active{transform:translateY(1px)}
.btn-cancel{
  width:100%; padding:11px; border-radius:13px; font-size:14px;
  background:rgba(255,255,255,.07); color:var(--text);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
}
.btn-cancel:active{transform:translateY(1px)}

/* ---------- HUD ---------- */
.hud{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:8px 14px; border-radius:14px;
  background:var(--panel); border:1px solid var(--line);
}
.stat{display:flex; flex-direction:column; min-width:70px}
.stat b{font-family:"Outfit",sans-serif; font-size:24px; font-weight:800; line-height:1.1}
.stat label{font-size:11px; color:var(--muted); letter-spacing:.08em; font-family:"Outfit",sans-serif; font-weight:700}
.stat.right{align-items:flex-end}
#timen.low{color:var(--gold)} #timen.crit{color:var(--coral)}
.circlewrap{display:flex; flex-direction:column; align-items:center; gap:2px}
#ucircle{width:64px; height:64px}
#gaugearc{transition:stroke-dashoffset .25s; transform:rotate(-90deg); transform-origin:32px 32px}
#sweep{transform-origin:32px 32px; transition:transform .5s cubic-bezier(.3,1.4,.4,1)}
#caption{font-family:"STIX Two Text",serif; font-size:12px; color:var(--gold-soft); min-height:20px;
  display:inline-flex; align-items:center; gap:3px; transition:opacity .3s}

.timebar{
  width:100%; height:10px; border-radius:6px; overflow:hidden;
  background:rgba(6,41,31,.86); border:1px solid rgba(255,216,77,.14);
}
#timefill{display:block; height:100%; width:100%; border-radius:6px;
  background:linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold-soft));
  transition:width .12s linear, background .3s}
#timefill.low{background:linear-gradient(90deg, #f97316, var(--gold-deep), var(--gold))}
#timefill.crit{background:linear-gradient(90deg, #dc2626, #f97316, #facc15)}
.targetbar{width:100%; display:flex; align-items:center; gap:8px}
.targetbar .track{flex:1; height:6px; background:var(--panel); border-radius:4px; overflow:hidden}
#targetfill{display:block; height:100%; width:0; background:linear-gradient(90deg, var(--lime-deep), var(--lime)); border-radius:4px; transition:width .25s}
#targetlbl{font-size:11px; color:var(--muted); font-family:"Outfit",sans-serif; font-weight:700; white-space:nowrap}

/* ---------- 보드 ---------- */
.board-shell{
  padding:8px; border-radius:18px;
  background:#f2e6b8;
  border:3px solid var(--gold);
  box-shadow:0 12px 26px rgba(0,18,12,.28), inset 0 1px 0 rgba(255,255,255,.5);
  transition:background .3s, box-shadow .3s, border-color .3s;
}
.board-shell.fever{
  background:radial-gradient(circle, #fff1a8 0%, #ffd76b 34%, #f2e6b8 72%);
  box-shadow:0 0 36px rgba(250,204,21,.6), inset 0 2px 8px rgba(6,41,31,.18);
}
#boardwrap{position:relative; width:calc(var(--t)*6 + var(--g)*5); height:calc(var(--t)*6 + var(--g)*5); touch-action:none}
.tile{
  position:absolute; width:var(--t); height:var(--t);
  background:var(--ivory); border:1px solid rgba(6,41,31,.08); border-radius:10px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  color:#173a29;
  box-shadow:0 3px 0 rgba(6,41,31,.13), inset 0 1px 0 #fff;
  transition:top .24s cubic-bezier(.3,1.2,.4,1), left .24s, transform .16s, opacity .22s, background .1s, border-color .1s, box-shadow .1s;
  user-select:none;
}
.tile .fn{font-family:"STIX Two Text",serif; font-weight:600; font-size:12px; line-height:1}
.tile .fn.sin{color:#0e7490} .tile .fn.cos{color:#c2410c} .tile .fn.tan{color:#7c3aed}
.tile .fn.csc{color:#1d4ed8} .tile .fn.sec{color:#b45309} .tile .fn.cot{color:#15803d}
.tile b{font-family:"STIX Two Text",serif; font-weight:600; font-size:16px; line-height:1.15; letter-spacing:-.01em;
  display:flex; align-items:center; justify-content:center; gap:1px}
.tile b.num{font-size:17px}

/* 세로 분수꼴 */
.frac{display:inline-flex; flex-direction:column; align-items:center; line-height:1.1; font-size:.68em; vertical-align:middle}
.frac > span:first-child{border-bottom:1.5px solid currentColor; padding:0 3px .5px}
.frac > span:last-child{padding-top:.5px}
#status .frac,#caption .frac,.result-sub .frac,.htp-row .frac{font-size:.72em}
.tile.sel{
  background:var(--gold); border-color:var(--gold-deep); color:var(--deep);
  transform:scale(1.06); z-index:2;
  box-shadow:0 0 0 3px rgba(255,216,77,.25), 0 3px 0 #b97e08;
}
.tile.sel .fn.sin{color:#075e6e} .tile.sel .fn.cos{color:#9a3708} .tile.sel .fn.tan{color:#5b21b6}
.tile.sel .fn.csc{color:#1e40af} .tile.sel .fn.sec{color:#92400e} .tile.sel .fn.cot{color:#166534}
.tile.pop{transform:scale(0); opacity:0}
.tile.shake{animation:shk .22s; background:#ffd4d4; border-color:var(--coral)}
@keyframes shk{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#bo{position:absolute; inset:0; pointer-events:none; z-index:3}
#bfx{position:absolute; inset:0; pointer-events:none; z-index:4}
.float-pts{
  position:absolute; transform:translate(-50%,-50%);
  font-family:"Outfit",sans-serif; font-size:19px; font-weight:800; color:#3f6212;
  animation:rise .9s ease-out forwards; white-space:nowrap;
  text-shadow:0 1px 0 rgba(255,255,255,.6);
}
.float-pts.fv{
  color:#fff; font-size:24px;
  text-shadow:0 0 10px var(--gold), 0 0 20px var(--gold-deep), 0 2px 5px rgba(0,0,0,.35);
}
@keyframes rise{to{transform:translate(-50%,-170%); opacity:0}}

#status{min-height:24px; font-size:13.5px; color:var(--muted); text-align:center; font-family:"Jua",sans-serif;
  display:flex; align-items:center; justify-content:center; gap:3px}
#status .frac{font-family:"STIX Two Text",serif}
#status.warn{color:var(--gold)} #status.good{color:var(--lime)}

footer{width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px}
.btn-shuffle{
  font-size:14px; color:var(--text); padding:9px 14px; border-radius:10px;
  background:var(--forest-soft); box-shadow:inset 0 0 0 1px rgba(255,216,77,.22);
  transition:transform .14s ease;
}
.btn-shuffle:active{transform:scale(.97)}
.hint{font-size:12px; color:var(--muted)}

/* ---------- 모달 (라운드 클리어 / 게임 오버) ---------- */
.veil{
  position:absolute; inset:0; z-index:20;
  background:rgba(0,18,12,.88); backdrop-filter:blur(8px);
  display:flex; align-items:center; justify-content:center; padding:20px;
  border-radius:28px;
}
.veil[hidden]{display:none}
.card{
  width:100%; max-width:330px; text-align:center;
  background:var(--forest); border:1px solid rgba(255,216,77,.18); border-radius:20px;
  padding:24px 22px;
  box-shadow:0 28px 70px rgba(0,12,8,.64);
  display:flex; flex-direction:column; gap:8px;
}
.card-title{
  color:var(--gold); font-size:26px; line-height:1.15;
  text-shadow:0 0 20px rgba(255,216,77,.28);
}
.card-sub{color:var(--muted); font-size:13px; font-family:"Jua",sans-serif}
.result{
  font-family:"Outfit",sans-serif; font-size:46px; font-weight:800; line-height:1.1;
  color:var(--gold); margin:6px 0 0;
}
.result-sub{font-size:13px; color:var(--muted); line-height:1.7; margin-bottom:10px}
.result-sub b{color:var(--gold-soft)}
.card .btn-start{margin-top:4px}

/* ---------- 일반각 스와이프 모드 ---------- */
.swipe-overlay{
  position:absolute; inset:0; z-index:9;
  display:flex; flex-direction:column; align-items:center; gap:12px; padding:16px 16px 20px;
  background:
    radial-gradient(circle at 14% 12%, rgba(110,227,214,.10) 0 50px, transparent 51px),
    linear-gradient(155deg, #0b3a2b 0%, #06291f 100%);
  border-radius:28px;
  opacity:1; visibility:visible;
  transition:opacity .35s ease, visibility .35s ease;
}
.swipe-overlay.hide{opacity:0; visibility:hidden; pointer-events:none}
.sw-hud{width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:8px 14px; border-radius:14px; background:var(--panel); border:1px solid rgba(110,227,214,.18)}
.sw-hud .stat b{color:var(--cyan)}
.sw-title{font-size:13px; color:var(--muted)}
.sw-timebar{width:100%; height:10px; border-radius:6px; overflow:hidden;
  background:rgba(6,41,31,.86); border:1px solid rgba(110,227,214,.16)}
#sw-timefill{display:block; height:100%; width:100%; border-radius:6px;
  background:linear-gradient(90deg, #14b8a6, var(--cyan), #b9fff5);
  transition:width .12s linear}
#sw-timefill.crit{background:linear-gradient(90deg,#dc2626,#f97316,#facc15)}
.sw-card{
  width:100%; max-width:280px; min-height:104px; margin-top:6px;
  display:flex; align-items:center; justify-content:center;
  background:var(--ivory); border-radius:18px; border:1px solid rgba(6,41,31,.08);
  box-shadow:0 6px 0 rgba(6,41,31,.15), inset 0 1px 0 #fff;
  font-family:"STIX Two Text",serif; font-weight:600; font-size:30px; color:#173a29;
  touch-action:none; user-select:none; gap:4px;
  transition:transform .15s ease, background .15s ease;
}
.sw-card .fn{font-style:italic}
.sw-card .fn.sin{color:#0e7490} .sw-card .fn.cos{color:#c2410c}
.sw-card.good{background:#e7ffd6; transform:scale(1.04)}
.sw-card.bad{background:#ffd4d4; animation:shk .22s}
.sw-streak{min-height:18px; font-size:13px; color:var(--gold); font-family:"Outfit",sans-serif; font-weight:700}
.sw-pads{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:100%; max-width:300px}
.sw-pad{
  padding:13px 6px; border-radius:13px;
  background:rgba(6,41,31,.72); border:1px solid rgba(110,227,214,.24); color:var(--text);
  font-family:"STIX Two Text",serif; font-weight:600; font-size:17px;
  transition:transform .12s ease, background .15s, border-color .15s;
}
.sw-pad:active{transform:scale(.96)}
.sw-pad[data-ans="sin x"]{grid-column:2; grid-row:1}
.sw-pad[data-ans="cos x"]{grid-column:1; grid-row:2}
.sw-pad[data-ans="−cos x"]{grid-column:3; grid-row:2}
.sw-pad[data-ans="−sin x"]{grid-column:2; grid-row:3}
.sw-center{grid-column:2; grid-row:2; display:grid; place-items:center; color:var(--muted); font-size:20px}
.sw-pad.hit{background:var(--lime); border-color:var(--lime-deep); color:var(--deep)}
.sw-pad.miss{background:#7f1d1d; border-color:var(--coral); color:#ffe4e6}
.sw-exit{margin-top:auto}
/* 오답 단위원 리플레이 */
.rp-circle{width:170px; height:170px; margin:4px auto}
#rp-t{transform-origin:85px 85px; transition:transform .8s cubic-bezier(.3,1.3,.4,1)}
#rp-x{transform-origin:85px 85px}
.rp-cap{font-family:"STIX Two Text",serif; font-size:19px; color:var(--gold-soft);
  display:flex; align-items:center; justify-content:center; gap:4px}
.rp-sub{font-family:"STIX Two Text",serif; font-size:14px; color:var(--muted); min-height:20px;
  display:flex; align-items:center; justify-content:center; gap:3px}

@media (max-height:740px){
  .welcome-overlay{min-height:calc(100dvh - 24px)}
  .welcome-card{gap:10px}
  .welcome-icon-wrap{width:78px; height:78px}
  .welcome-icon{font-size:46px}

<script>
(() => {
const N = 6, GAUGE_MAX = 16, FEVER_LEN = 8;
const $ = id => document.getElementById(id);

/* ---------- tile data: sin·cos 특수각, 육십분법 + 호도법 ---------- */
const SINV = {0:'0',30:'1/2',45:'√2/2',60:'√3/2',90:'1',120:'√3/2',135:'√2/2',150:'1/2',180:'0',210:'−1/2',225:'−√2/2',240:'−√3/2',270:'−1',300:'−√3/2',315:'−√2/2',330:'−1/2'};
const COSV = {0:'1',30:'√3/2',45:'√2/2',60:'1/2',90:'0',120:'−1/2',135:'−√2/2',150:'−√3/2',180:'−1',210:'−√3/2',225:'−√2/2',240:'−1/2',270:'0',300:'1/2',315:'√2/2',330:'√3/2'};
const RAD = {0:'0',30:'π/6',45:'π/4',60:'π/3',90:'π/2',120:'2π/3',135:'3π/4',150:'5π/6',180:'π',210:'7π/6',225:'5π/4',240:'4π/3',270:'3π/2',300:'5π/3',315:'7π/4',330:'11π/6'};
/* tan: 90°·270°는 정의되지 않으므로 제외. csc·sec·cot도 각각 정의되는 각만 수록 */
const TANV = {0:'0',30:'√3/3',45:'1',60:'√3',120:'−√3',135:'−1',150:'−√3/3',180:'0',210:'√3/3',225:'1',240:'√3',300:'−√3',315:'−1',330:'−√3/3'};
const CSCV = {30:'2',45:'√2',60:'2√3/3',90:'1',120:'2√3/3',135:'√2',150:'2',210:'−2',225:'−√2',240:'−2√3/3',270:'−1',300:'−2√3/3',315:'−√2',330:'−2'};
const SECV = {0:'1',30:'2√3/3',45:'√2',60:'2',120:'−2',135:'−√2',150:'−2√3/3',180:'−1',210:'−2√3/3',225:'−√2',240:'−2',300:'2',315:'√2',330:'2√3/3'};
const COTV = {30:'√3',45:'1',60:'√3/3',90:'0',120:'−√3/3',135:'−1',150:'−√3',210:'√3',225:'1',240:'√3/3',270:'0',300:'−√3/3',315:'−1',330:'−√3'};
const EXPRS = [];
const pushFn = (fn, table) => {
  for (const d in table){
    const deg = +d;
    EXPRS.push({fn, arg:d+'°', deg, val:table[d], rad:false});
    EXPRS.push({fn, arg:RAD[d], deg, val:table[d], rad:true});
  }
};
pushFn('sin', SINV); pushFn('cos', COSV); pushFn('tan', TANV);
pushFn('csc', CSCV); pushFn('sec', SECV); pushFn('cot', COTV);
['0','1/2','√2/2','√3/2','1','−1/2','−√2/2','−√3/2','−1','√3/3','√3','−√3/3','−√3','2','√2','2√3/3','−2','−√2','−2√3/3']
  .forEach(v => EXPRS.push({fn:null, arg:v, deg:null, val:v, rad:false}));
const isNeg = v => v.startsWith('−');

/* a/b 꼴을 세로 분수 마크업으로 변환 (예: 1/2, √3/2, 11π/6, −√2/2) */
const fmt = s => String(s).replace(/(−?)([0-9√π]+)\/([0-9]+)/g,
  (_, sg, top, bot) => `${sg}<span class="frac"><span>${top}</span><span>${bot}</span></span>`);
const tileHTML = e => e.fn
  ? `<span class="fn ${e.fn}">${e.fn}</span><b>${fmt(e.arg)}</b>`
  : `<b class="num">${fmt(e.arg)}</b>`;

/* ---------- 난이도 ---------- */
const Q1 = [0,30,45,60,90];
const HALF = [0,30,45,60,90,120,135,150,180];
const ALLDEG = Object.keys(SINV).map(Number);
const DIFFS = {
  easy:   {name:'쉬움',   desc:'1사분면 · 육십분법', angles:Q1,     rad:false, tan:false, time:40, target0:500,  mult:1.3},
  normal: {name:'보통',   desc:'둔각까지 · 호도법',  angles:HALF,   rad:true,  tan:false, time:45, target0:900,  mult:1.35},
  hard:   {name:'어려움', desc:'전 범위 일반각',     angles:ALLDEG, rad:true,  tan:false, time:45, target0:1300, mult:1.4},
  master: {name:'고수',   desc:'전 범위 + tan',      angles:ALLDEG, rad:true,  tan:true,  time:45, target0:1500, mult:1.4},
  hell:   {name:'지옥',   desc:'csc · sec · cot 총출동', angles:ALLDEG, rad:true, tan:true, recip:true, time:45, target0:1800, mult:1.45},
};
let diffKey = 'easy', diff = DIFFS.easy;
const RECIP = ['csc','sec','cot'];
function roundCfg(){
  return {time:diff.time,
    target: Math.round(diff.target0 * Math.pow(diff.mult, roundIdx) / 100) * 100};
}
function roundPool(){
  const fnOk = e => e.fn && (e.fn !== 'tan' || diff.tan)
    && (!RECIP.includes(e.fn) || diff.recip)
    && diff.angles.includes(e.deg) && (diff.rad || !e.rad);
  const vals = new Set();
  EXPRS.forEach(e => { if (fnOk(e)) vals.add(e.val); });
  return EXPRS.filter(e => e.fn ? fnOk(e) : vals.has(e.val));
}

/* ---------- state ---------- */
const BEST_KEY = 'trigpang-best';
const bestOf = key => +(localStorage.getItem(BEST_KEY + '-' + key) || (key === 'easy' ? localStorage.getItem(BEST_KEY) : 0) || 0);
let grid = [], idc = 0, chain = [], chainVal = null;
let score = 0, best = 0, pops = 0, longest = 0, roundIdx = 0, roundScore = 0;
let gauge = 0, fever = false, feverT = 0, hot = [];
let time = 40, playing = false, locked = false, dragging = false, raf = 0, prev = 0;
let mode = 'pang';

function tpx(){ const el = $('boardwrap'); return (el.clientWidth - 5*6)/6; }
const posX = c => c * (tpx() + 6);
const posY = r => r * (tpx() + 6);

/* ---------- spawn ---------- */
function pool(){
  const base = roundPool();
  if (fever) return base.filter(e => hot.includes(e.val));
  const p = [];
  base.forEach(e => { p.push(e); if (!isNeg(e.val)) p.push(e); });
  return p;
}
function spawnExpr(){ const p = pool(); return p[Math.floor(Math.random()*p.length)]; }

function makeTile(r, c, fromAbove){
  const e = spawnExpr();
  const t = { id: idc++, r, c, expr: e, val: e.val, el: document.createElement('div') };
  const el = t.el;
  el.className = 'tile';
  el.innerHTML = tileHTML(e);
  el.style.left = posX(c) + 'px';
  el.style.top = (fromAbove ? posY(r) - (fromAbove)*(tpx()+6) - 20 : posY(r)) + 'px';
  $('boardwrap').appendChild(el);
  if (fromAbove) requestAnimationFrame(() => requestAnimationFrame(() => { el.style.top = posY(r) + 'px'; }));
  return t;
}

function buildBoard(){
  $('boardwrap').querySelectorAll('.tile').forEach(n => n.remove());
  grid = [];
  for (let r=0; r<N; r++){ grid[r] = []; for (let c=0; c<N; c++) grid[r][c] = makeTile(r, c, 0); }
  ensureMoves(true);
}

/* ---------- move detection ---------- */
function hasMove(){
  const seen = new Set();
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    const t = grid[r][c]; if (!t || seen.has(t.id)) continue;
    let count = 0; const stack = [t]; const comp = new Set([t.id]);
    while (stack.length){
      const u = stack.pop(); count++;
      for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++){
        const nr=u.r+dr, nc=u.c+dc;
        if (nr<0||nr>=N||nc<0||nc>=N||(dr===0&&dc===0)) continue;
        const v = grid[nr][nc];
        if (v && v.val===t.val && !comp.has(v.id)){ comp.add(v.id); stack.push(v); }
      }
    }
    comp.forEach(id => seen.add(id));
    if (count >= 3) return true;
  }
  return false;
}
function ensureMoves(silent){
  let guard = 0;
  while (!hasMove() && guard++ < 20){
    const vals = [];
    for (let r=0;r<N;r++) for (let c=0;c<N;c++) vals.push(grid[r][c].expr);
    for (let i=vals.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [vals[i],vals[j]]=[vals[j],vals[i]]; }
    let k=0;
    for (let r=0;r<N;r++) for (let c=0;c<N;c++){
      const t = grid[r][c], e = vals[k++];
      t.expr = e; t.val = e.val;
      t.el.innerHTML = tileHTML(e);
    }
    if (!silent) say('가능한 조합이 없어 자동으로 섞었어요', 'warn');
  }
}

/* ---------- chain / drag ---------- */
const bw = $('boardwrap');
function cellAt(x, y){
  const rect = bw.getBoundingClientRect();
  const s = tpx() + 6;
  const c = Math.floor((x-rect.left)/s), r = Math.floor((y-rect.top)/s);
  if (r<0||r>=N||c<0||c>=N) return null;
  const cx = rect.left + posX(c) + tpx()/2, cy = rect.top + posY(r) + tpx()/2;
  if (Math.hypot(x-cx, y-cy) > tpx()*0.46) return null;
  return grid[r][c];
}
function drawChainLine(){
  const w = bw.clientWidth;
  $('bo').setAttribute('viewBox', `0 0 ${w} ${w}`);
  let h = '';
  if (chain.length > 1){
    const pts = chain.map(t => (posX(t.c)+tpx()/2)+','+(posY(t.r)+tpx()/2)).join(' ');
    h = `<polyline points="${pts}" fill="none" stroke="#f0a80a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity=".3"/>`
      + `<polyline points="${pts}" fill="none" stroke="#ffd84d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>`;
  }
  $('bo').innerHTML = h;
}
function setSel(t, on){ t.el.classList.toggle('sel', on); }
function clearChain(){
  chain.forEach(t => setSel(t, false));
  chain = []; chainVal = null; drawChainLine();
}
function tryAdd(t){
  if (!t || locked) return;
  if (chain.length && t === chain[chain.length-2]){
    setSel(chain.pop(), false); drawChainLine(); sayChain(); return;
  }
  if (chain.includes(t)) return;
  if (!chain.length){ chain = [t]; chainVal = t.val; setSel(t, true); drawChainLine(); sayChain(); return; }
  const last = chain[chain.length-1];
  if (Math.abs(last.r-t.r) > 1 || Math.abs(last.c-t.c) > 1) return;
  if (t.val !== chainVal){
    t.el.classList.add('shake'); setTimeout(()=>t.el.classList.remove('shake'), 230);
    return;
  }
  chain.push(t); setSel(t, true); drawChainLine(); sayChain();
}
function sayChain(){
  if (!chain.length){ say('같은 값끼리 드래그로 연결하세요'); return; }
  say(`${fmt(chainVal)} 사슬 · ${chain.length}개${chain.length>=3 ? ' — 놓으면 팡' : ''}`, chain.length>=3 ? 'good' : '');
}
bw.addEventListener('pointerdown', e => {
  if (!playing || locked) return;
  dragging = true; bw.setPointerCapture(e.pointerId);
  tryAdd(cellAt(e.clientX, e.clientY));
});
bw.addEventListener('pointermove', e => { if (dragging) tryAdd(cellAt(e.clientX, e.clientY)); });
function release(){
  if (!dragging) return;
  dragging = false;
  if (!playing || locked) { clearChain(); return; }
  if (chain.length >= 3) doPop();
  else { clearChain(); sayChain(); }
}
bw.addEventListener('pointerup', release);
bw.addEventListener('pointercancel', release);

/* ---------- pop / gravity ---------- */
function doPop(){
  locked = true;
  const n = chain.length;
  const mult = fever ? 2 : 1;
  const pts = n*n*10*mult;
  score += pts; roundScore += pts; pops++; longest = Math.max(longest, n);
  $('score').textContent = score;
  drawTarget();
  if (!fever){ gauge = Math.min(gauge + n, GAUGE_MAX); drawGauge(gauge/GAUGE_MAX); }
  const mid = chain[Math.floor(n/2)];
  const fl = document.createElement('div');
  fl.className = 'float-pts' + (fever ? ' fv' : '');
  fl.textContent = '+' + pts;
  fl.style.left = (posX(mid.c)+tpx()/2)+'px'; fl.style.top = (posY(mid.r)+tpx()/2)+'px';
  $('bfx').appendChild(fl); setTimeout(()=>fl.remove(), 950);
  const ex = chain.find(t => t.expr.deg !== null) || chain[0];
  sweepTo(ex);
  say(`${fmt(chainVal)} × ${n} 팡  +${pts}`, 'good');
  chain.forEach(t => { t.el.classList.add('pop'); grid[t.r][t.c] = null; });
  const popped = chain.slice();
  chain = []; chainVal = null; drawChainLine();
  setTimeout(() => {
    popped.forEach(t => t.el.remove());
    gravity();
    setTimeout(() => {
      locked = false;
      if (roundScore >= roundCfg().target){ roundClear(); return; }
      if (!fever && gauge >= GAUGE_MAX) startFever();
      ensureMoves(false);
    }, 270);
  }, 230);
}
function gravity(){
  for (let c=0; c<N; c++){
    const colTiles = [];
    for (let r=N-1; r>=0; r--) if (grid[r][c]) colTiles.push(grid[r][c]);
    let r = N-1;
    colTiles.forEach(t => { grid[r][c] = t; t.r = r; t.el.style.top = posY(r)+'px'; r--; });
    const missing = r + 1;
    for (let i=r; i>=0; i--){
      const t = makeTile(i, c, missing);
      grid[i][c] = t;
    }
  }
}

/* ---------- unit circle ---------- */
function sweepTo(t){
  if (t.expr.deg === null) return;
  $('sweep').style.transform = `rotate(${-t.expr.deg}deg)`;
  const cap = $('caption');
  cap.innerHTML = t.expr.fn ? `${t.expr.fn} ${fmt(t.expr.arg)} = ${fmt(t.val)}` : '';
  cap.style.opacity = 1;
  clearTimeout(cap._t); cap._t = setTimeout(()=>cap.style.opacity=.45, 1800);
}
function drawGauge(f){
  $('gaugearc').style.strokeDashoffset = 182.2 * (1 - f);
}

/* ---------- fever ---------- */
function startFever(){
  fever = true; feverT = FEVER_LEN;
  const posVals = [...new Set(roundPool().filter(e => !isNeg(e.val)).map(e => e.val))];
  hot = posVals.sort(()=>Math.random()-.5).slice(0,4);
  $('boardshell').classList.add('fever');
  say('피버! 점수 2배', 'warn');
}
function endFever(){
  fever = false; gauge = 0; drawGauge(0);
  $('boardshell').classList.remove('fever');
}

/* ---------- status / timer ---------- */
function say(msg, cls){ const s = $('status'); s.innerHTML = msg; s.className = cls || ''; }
function tick(ts){
  if (!playing) return;
  if (prev){
    const dt = (ts - prev)/1000;
    time -= dt;
    if (fever){ feverT -= dt; drawGauge(Math.max(feverT/FEVER_LEN, 0)); if (feverT <= 0) endFever(); }
  }
  prev = ts;
  if (time <= 0){ time = 0; updateTimer(); gameOver(); return; }
  updateTimer();
  raf = requestAnimationFrame(tick);
}
function updateTimer(){
  const f = $('timefill'), tn = $('timen');
  f.style.width = (time/roundCfg().time*100)+'%';
  const cls = time <= 5 ? 'crit' : time <= 12 ? 'low' : '';
  f.className = cls; tn.className = cls;
  tn.textContent = time.toFixed(1);
}

/* ---------- flow ---------- */
function drawTarget(){
  const cfg = roundCfg();
  $('targetfill').style.width = Math.min(roundScore/cfg.target*100, 100) + '%';
  $('targetlbl').textContent = '목표 ' + cfg.target;
}
function saveBest(){
  if (score > best){ best = score; localStorage.setItem(BEST_KEY + '-' + diffKey, best); }
  drawBests();
}
function drawBests(){
  [...Object.keys(DIFFS), 'swipe'].forEach(k => {
    const el = $('best-' + k);
    if (el) el.textContent = '최고 ' + bestOf(k);
  });
}
function startRound(){
  const cfg = roundCfg();
  roundScore = 0; time = cfg.time; locked = false; chain = []; chainVal = null;
  $('roundlbl').textContent = `${diff.name} · 라운드 ${roundIdx+1}`;
  drawTarget(); buildBoard(); drawChainLine(); updateTimer();
  say(`${diff.name} 라운드 ${roundIdx+1} — ${diff.desc}`);
  $('veil').hidden = true;
  playing = true; prev = 0; raf = requestAnimationFrame(tick);
}
function roundClear(){
  playing = false; dragging = false; cancelAnimationFrame(raf);
  clearChain();
  const bonus = Math.ceil(time) * 10;
  score += bonus; $('score').textContent = score;
  $('rtitle').textContent = `라운드 ${roundIdx+1} 클리어!`;
  roundIdx++;
  const next = roundCfg();
  $('rbonus').textContent = '+' + bonus;
  $('rnext').innerHTML = `남은 시간 보너스<br><br>다음 라운드 목표 <b>${next.target}점</b> · ${next.time}초`;
  $('overcard').hidden = true; $('roundcard').hidden = false;
  $('veil').hidden = false;
}
function startGame(key){
  mode = 'pang';
  diffKey = key; diff = DIFFS[key]; best = bestOf(key);
  score = 0; pops = 0; longest = 0; gauge = 0; roundIdx = 0;
  fever = false; feverT = 0; hot = [];
  $('score').textContent = '0'; drawGauge(0); $('boardshell').classList.remove('fever');
  $('caption').textContent = '';
  $('overcard').hidden = true; $('roundcard').hidden = true; $('veil').hidden = true;
  $('welcome').classList.add('hide');
  startRound();
}
function gameOver(){
  playing = false; dragging = false; cancelAnimationFrame(raf);
  clearChain();
  saveBest();
  $('finalscore').textContent = score;
  $('finalsub').innerHTML = `${diff.name} · 라운드 ${roundIdx+1}에서 종료 · 최고 기록 <b>${best}</b><br>팡 ${pops}회 · 최장 사슬 ${longest}개`;
  $('roundcard').hidden = true; $('overcard').hidden = false;
  $('veil').hidden = false;
}
function goHome(){
  $('veil').hidden = true;
  $('overcard').hidden = true; $('roundcard').hidden = true; $('replaycard').hidden = true;
  swStop();
  $('swipemode').classList.add('hide');
  drawBests();
  $('welcome').classList.remove('hide');
}
document.querySelectorAll('.diff-btn').forEach(b =>
  b.addEventListener('click', () => startGame(b.dataset.diff)));
$('retrybtn').addEventListener('click', () => mode === 'swipe' ? swStart() : startGame(diffKey));
$('homebtn').addEventListener('click', goHome);
$('nextbtn').addEventListener('click', () => { $('roundcard').hidden = true; startRound(); });
$('shuffle').addEventListener('click', () => {
  if (!playing || locked) return;
  dragging = false; clearChain();
  time = Math.max(time - 2, 0.1);
  const vals = [];
  for (let r=0;r<N;r++) for (let c=0;c<N;c++) vals.push(grid[r][c].expr);
  for (let i=vals.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [vals[i],vals[j]]=[vals[j],vals[i]]; }
  let k=0;
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    const t = grid[r][c], e = vals[k++];
    t.expr = e; t.val = e.val;
    t.el.innerHTML = e.fn ? `<span class="fn ${e.fn}">${e.fn}</span><b>${e.arg}</b>` : `<b class="num">${e.arg}</b>`;
  }
  ensureMoves(true);
  say('보드 섞음 −2초', 'warn');
});

window.addEventListener('resize', () => {
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    const t = grid[r]?.[c]; if (!t) continue;
    t.el.style.left = posX(c)+'px'; t.el.style.top = posY(r)+'px';
  }
  drawChainLine();
});

/* ---------- 일반각 스와이프 모드 ----------
   sin(π−x) 같은 일반각 식을 sin x / −sin x / cos x / −cos x 로 축약.
   위=sin x, 아래=−sin x, 왼쪽=cos x, 오른쪽=−cos x. 오답이면 단위원 리플레이. */
const SW_TIME = 60, SW_X = 30; // 리플레이 예시는 항상 x = 30°
const SW_T = [
  {arg:'−x',       sin:'−sin x', cos:'cos x',  deg: x => (360 - x) % 360},
  {arg:'π − x',    sin:'sin x',  cos:'−cos x', deg: x => 180 - x},
  {arg:'π + x',    sin:'−sin x', cos:'−cos x', deg: x => 180 + x},
  {arg:'π/2 − x',  sin:'cos x',  cos:'sin x',  deg: x => 90 - x},
  {arg:'π/2 + x',  sin:'cos x',  cos:'−sin x', deg: x => 90 + x},
  {arg:'3π/2 − x', sin:'−cos x', cos:'−sin x', deg: x => 270 - x},
  {arg:'3π/2 + x', sin:'−cos x', cos:'sin x',  deg: x => 270 + x},
];
let swScore = 0, swStreak = 0, swMaxStreak = 0, swHits = 0, swMiss = 0;
let swTime = SW_TIME, swPlaying = false, swRaf = 0, swPrev = 0, swCard = null, swLock = false;

function swDeal(){
  let fn, t;
  do {
    fn = Math.random() < .5 ? 'sin' : 'cos';
    t = SW_T[Math.floor(Math.random() * SW_T.length)];
  } while (swCard && swCard.fn === fn && swCard.t === t);
  swCard = {fn, t, ans: t[fn]};
  $('sw-card').innerHTML = `<span class="fn ${fn}">${fn}</span>(${fmt(t.arg)})`;
  $('sw-card').classList.remove('good','bad');
}
function swSay(){
  $('sw-streak').textContent = swStreak >= 2 ? `${swStreak}연속 정답!` : '이 식은 무엇과 같을까?';
}
function swTick(ts){
  if (!swPlaying) return;
  if (swPrev) swTime -= (ts - swPrev)/1000;
  swPrev = ts;
  if (swTime <= 0){ swTime = 0; swDrawTime(); swOver(); return; }
  swDrawTime();
  swRaf = requestAnimationFrame(swTick);
}
function swDrawTime(){
  $('sw-timen').textContent = swTime.toFixed(1);
  const f = $('sw-timefill');
  f.style.width = (swTime/SW_TIME*100) + '%';
  f.classList.toggle('crit', swTime <= 8);
}
function swPause(){ swPlaying = false; cancelAnimationFrame(swRaf); }
function swResume(){ if (swTime <= 0) return; swPlaying = true; swPrev = 0; swRaf = requestAnimationFrame(swTick); }
function swStop(){ swPause(); swLock = false; }

function swStart(){
  mode = 'swipe';
  swScore = 0; swStreak = 0; swMaxStreak = 0; swHits = 0; swMiss = 0;
  swTime = SW_TIME; swCard = null; swLock = false;
  $('sw-score').textContent = '0';
  $('overcard').hidden = true; $('roundcard').hidden = true; $('replaycard').hidden = true;
  $('veil').hidden = true;
  $('welcome').classList.add('hide');
  $('swipemode').classList.remove('hide');
  swDeal(); swSay(); swDrawTime();
  swPlaying = true; swPrev = 0; swRaf = requestAnimationFrame(swTick);
}
function swOver(){
  swStop();
  const key = BEST_KEY + '-swipe';
  const prevBest = bestOf('swipe');
  if (swScore > prevBest) localStorage.setItem(key, swScore);
  $('finalscore').textContent = swScore;
  $('finalsub').innerHTML = `일반각 모드 · 정답 ${swHits} · 오답 ${swMiss} · 최대 연속 ${swMaxStreak}<br>최고 기록 <b>${Math.max(swScore, prevBest)}</b>`;
  $('roundcard').hidden = true; $('replaycard').hidden = true; $('overcard').hidden = false;
  $('veil').hidden = false;
}
const swPadOf = a => document.querySelector(`.sw-pad[data-ans="${a}"]`);
function swAnswer(ans){
  if (!swPlaying || swLock) return;
  const card = $('sw-card');
  if (ans === swCard.ans){
    swHits++; swStreak++; swMaxStreak = Math.max(swMaxStreak, swStreak);
    const pts = 100 + Math.min(swStreak - 1, 10) * 20;
    swScore += pts;
    $('sw-score').textContent = swScore;
    card.classList.add('good');
    const pad = swPadOf(ans); pad.classList.add('hit');
    swLock = true;
    setTimeout(() => { pad.classList.remove('hit'); swLock = false; swDeal(); swSay(); }, 220);
  } else {
    swMiss++; swStreak = 0;
    card.classList.add('bad');
    const wrongPad = swPadOf(ans), rightPad = swPadOf(swCard.ans);
    wrongPad.classList.add('miss'); rightPad.classList.add('hit');
    swLock = true;
    swPause();
    setTimeout(() => {
      wrongPad.classList.remove('miss'); rightPad.classList.remove('hit');
      swReplay();
    }, 550);
  }
}
function swReplay(){
  const {fn, t, ans} = swCard;
  const T = t.deg(SW_X);
  const FNV = fn === 'sin' ? SINV : COSV;
  const ansAt30 = ans.replace('x', SW_X + '°');
  $('rp-x').style.transform = `rotate(${-SW_X}deg)`;
  $('rp-t').style.transform = `rotate(${-SW_X}deg)`;
  $('rp-cap').innerHTML = `${fn}(${fmt(t.arg)}) = ${fmt(ans)}`;
  $('rp-sub').innerHTML = `x = ${SW_X}° 라면 : ${fn} ${T}° = ${fmt(FNV[T])} = ${fmt(ansAt30)}`;
  $('overcard').hidden = true; $('roundcard').hidden = true; $('replaycard').hidden = false;
  $('veil').hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $('rp-t').style.transform = `rotate(${-T}deg)`;
  }));
}
$('rp-continue').addEventListener('click', () => {
  $('veil').hidden = true; $('replaycard').hidden = true;
  swLock = false; swDeal(); swSay(); swResume();
});
$('swipebtn').addEventListener('click', swStart);
$('sw-exit').addEventListener('click', goHome);
document.querySelectorAll('.sw-pad').forEach(p =>
  p.addEventListener('click', () => swAnswer(p.dataset.ans)));
/* 카드 스와이프 제스처 */
(() => {
  const card = $('sw-card');
  let sx = 0, sy = 0, on = false;
  card.addEventListener('pointerdown', e => {
    on = true; sx = e.clientX; sy = e.clientY;
    try { card.setPointerCapture(e.pointerId); } catch {}
  });
  card.addEventListener('pointerup', e => {
    if (!on) return; on = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    swAnswer(Math.abs(dx) > Math.abs(dy)
      ? (dx > 0 ? '−cos x' : 'cos x')
      : (dy > 0 ? '−sin x' : 'sin x'));
  });
})();
document.addEventListener('keydown', e => {
  if (mode !== 'swipe' || !swPlaying) return;
  const map = {ArrowUp:'sin x', ArrowDown:'−sin x', ArrowLeft:'cos x', ArrowRight:'−cos x'};
  if (map[e.key]){ e.preventDefault(); swAnswer(map[e.key]); }
});

drawBests();
buildBoard();
})();
</script>
</body>
