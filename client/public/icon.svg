<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe58a"/>
      <stop offset="55%" stop-color="#ffd84d"/>
      <stop offset="100%" stop-color="#f0a80a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94f20d"/>
      <stop offset="100%" stop-color="#2e9e46"/>
    </linearGradient>
    <clipPath id="bodyclip">
      <ellipse cx="256" cy="330" rx="118" ry="128"/>
    </clipPath>
  </defs>

  <!-- 배경: 포레스트 라운드 스퀘어 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#0b3a2b"/>
  <circle cx="440" cy="80" r="90" fill="rgba(255,216,77,0.08)"/>
  <circle cx="70" cy="440" r="80" fill="rgba(110,227,214,0.10)"/>

  <!-- 크라운 잎 -->
  <g>
    <path d="M256 150 C 236 92, 240 60, 256 28 C 272 60, 276 92, 256 150 Z" fill="url(#leaf)"/>
    <path d="M250 158 C 204 120, 178 106, 138 102 C 166 146, 196 168, 244 180 Z" fill="#2e9e46"/>
    <path d="M262 158 C 308 120, 334 106, 374 102 C 346 146, 316 168, 268 180 Z" fill="#2e9e46"/>
    <path d="M252 164 C 224 136, 202 128, 172 128 C 192 162, 218 178, 248 186 Z" fill="#94f20d" opacity="0.9"/>
    <path d="M260 164 C 288 136, 310 128, 340 128 C 320 162, 294 178, 264 186 Z" fill="#94f20d" opacity="0.9"/>
  </g>

  <!-- 파인애플 몸통 -->
  <ellipse cx="256" cy="330" rx="118" ry="128" fill="url(#body)" stroke="#b97e08" stroke-width="8"/>
  <!-- 크로스해치 -->
  <g clip-path="url(#bodyclip)" stroke="#b97e08" stroke-width="7" opacity="0.5">
    <line x1="90" y1="270" x2="330" y2="510"/>
    <line x1="130" y1="220" x2="410" y2="500"/>
    <line x1="190" y1="185" x2="450" y2="445"/>
    <line x1="260" y1="170" x2="460" y2="370"/>
    <line x1="422" y1="270" x2="182" y2="510"/>
    <line x1="382" y1="220" x2="102" y2="500"/>
    <line x1="322" y1="185" x2="62" y2="445"/>
    <line x1="252" y1="170" x2="52" y2="370"/>
  </g>
  <!-- 하이라이트 -->
  <ellipse cx="215" cy="270" rx="34" ry="48" fill="rgba(255,255,255,0.28)" transform="rotate(-18 215 270)"/>
</svg>
